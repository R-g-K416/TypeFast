.layout{display:grid;grid-template-columns:260px 1fr;max-width:1200px;margin:0 auto}
.left{background:#fff;border-right:2px solid #e2e8f0;padding:12px;min-height:calc(100vh - 60px);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}

.ubtn.active{background:#eef2ff;border-color:#4f46e5;color:#4f46e5}
.right{padding:14px}
.box{background:#fff;border:2px solid #e2e8f0;border-radius:14px;margin-bottom:14px;overflow:hidden}

.card:hover{border-color:#4f46e5;transform:translateY(-3px)}
.card.lock{opacity:.35;pointer-events:none}
.footer{background:#0f172a;color:#fff;text-align:center;padding:14px;border-radius:12px;margin-top:16px;font-weight:700}

#gameBox{border:3px solid #e2e8f0;border-radius:14px;margin:10px;position:relative;display:none;height:320px;width:calc(100% - 20px);max-width:1000px;align-self:center;background:#87ceeb;overflow:hidden}

.stats{display:flex;gap:6px;margin:8px 12px;width:calc(100% - 24px);max-width:1000px;align-self:center}
.stats div{flex:1;background:#fff;border:2px solid #e2e8f0;border-radius:10px;padding:6px;text-align:center;font-size:12px}
.kbd{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;background:#e0e7ff;padding:8px;margin:10px 12px 30px;border-radius:10px;width:calc(100% - 24px);max-width:1000px;align-self:center}

  "Every Saturday morning, Anaya visited the small library near the bus station. The building was old, but sunlight came through its tall windows and made the reading tables feel warm. One day, she found a handwritten note inside a book about astronomy. The note described how its writer had watched a meteor shower from a rooftop many years earlier. Anaya became curious about the person who had written it, so she asked the librarian whether the book had been donated. The librarian remembered an elderly teacher who often brought books to the library. Anaya wrote a reply and left it between the pages. A week later, she found another note waiting for her. The two strangers began exchanging recommendations, and Anaya discovered that a quiet room could connect people who had never met.",
  "When the first rain of the season arrived, Ravi took his old bicycle out of the storage room. He had planned to ride to the market, but the streets were shiny with water and the clouds looked heavy. Instead, he followed a narrow road beside the canal, moving slowly past gardens and small houses. Near a bridge, he noticed a delivery worker trying to protect a box from the rain. Ravi stopped and offered the worker a spare waterproof cover he carried in his bag. They secured the package and waited beneath a shop awning until the shower softened. Ravi reached home later than expected, yet he felt pleased with the afternoon. The ride reminded him that a plan did not always need to go perfectly for the day to be worthwhile.",
  "Meera joined the college robotics club because she wanted to learn how machines could solve practical problems. At the first meeting, the team struggled to make a small robot follow a straight line. They changed the wheels, adjusted the sensors, and tested the code again and again, but the robot kept turning toward the wall. Meera suggested recording each attempt instead of changing several things at once. The team began testing one adjustment at a time and writing down the result. Soon they found that one sensor was mounted at the wrong angle. After correcting it, the robot followed the track smoothly. The project taught Meera that patient observation was often more useful than hurried guessing, and the team used the same method for every challenge that followed.",
  "At sunrise, Kabir walked to the community garden with a notebook and a packet of seeds. The garden had been created by local residents who wanted fresh vegetables and a greener place for children to play. Some plants were growing well, but a row of young seedlings looked weak. Kabir asked the other volunteers about the watering schedule and learned that this row received too much afternoon sun. They moved a simple shade screen and checked the soil each morning. After a few days, the leaves looked stronger. The volunteers celebrated by sharing tea and planning what to plant next. Kabir returned home with muddy shoes and several new ideas. He understood that a healthy garden depended not on one big effort, but on many small acts of care repeated at the right time.",
  "Nisha was nervous about giving her first presentation to the class. She had prepared slides full of information and practiced every sentence late into the night. During rehearsal, however, she noticed that her audience could not follow the ideas because each slide contained too much text. Her friend suggested choosing three main points and explaining them with one clear example each. Nisha shortened the slides, added a simple diagram, and practiced speaking without reading every line. On presentation day, she still felt nervous, but she could look up and speak naturally. Her classmates asked thoughtful questions, and the teacher praised her clear explanation. Nisha learned that good preparation was not about fitting every fact onto a slide; it was about helping other people understand the most important ideas.",
  "A little repair shop stood at the end of a busy street, between a bakery and a store selling stationery. The owner, Mr. Das, repaired clocks, lamps, radios, and other objects that people often threw away. One afternoon, a student brought him a desk lamp that had stopped working before an important exam week. Mr. Das examined the wire and discovered that the problem was a loose connection rather than a broken lamp. He repaired it quickly and showed the student how to check the plug safely next time. The student thanked him and asked why he kept fixing old things when new ones were easy to buy. Mr. Das smiled and said that understanding a problem could save resources and teach patience. The student left carrying the lamp and a new respect for practical skills.",
  "During a school trip to the hills, the students were asked to observe the landscape rather than hurry toward the viewpoint. Their guide pointed out tiny flowers growing between rocks, marks left by flowing water, and layers visible along the side of a path. At first, some students thought the activity was slow, but soon they began noticing details they would otherwise have missed. One student sketched the shape of a cloud, while another recorded the different sounds of birds. At the end of the walk, the guide asked everyone to share one discovery. The answers were varied and surprising. The class returned with fewer photographs than expected, but with a better understanding of how careful attention reveals patterns in the natural world.",
  "Arjun wanted to improve his typing speed, so he decided to practice for a short time every evening. On the first day, he focused only on moving his fingers quickly and made many mistakes. The next day, he slowed down and tried to keep a steady rhythm. He also learned to relax his hands and look at the text instead of searching for every key. After a week, his accuracy improved, and his speed began to increase naturally. Whenever he hit a difficult sentence, he repeated it until the movement felt familiar. He kept a simple record of his results so he could notice gradual progress. Arjun learned that useful practice was not a race against the clock; it was a habit built through attention, consistency, and honest feedback.",
  "The town's train station had a large clock that was five minutes slow. For weeks, passengers complained about it, yet nobody knew who was responsible for maintaining it. One morning, a retired engineer named Leela noticed that the clock stopped whenever the wind was strong. She asked permission to inspect the mechanism and found that a small panel had become loose. With help from the station manager, she secured the panel and checked the clock over several days. When it kept accurate time, the manager placed a small sign thanking her for the repair. Leela did not expect praise; she simply liked solving practical puzzles. Still, she was glad that a small observation had made the station easier for everyone to use.",
  "On a quiet afternoon, Dev visited his grandfather to learn how to cook a family recipe. His grandfather did not measure every ingredient with a scale. Instead, he explained how the smell of toasted spices and the sound of simmering vegetables helped him decide what to do next. Dev tried to follow the instructions but added too much water at first. They adjusted the heat and allowed the sauce to reduce slowly. While they waited, his grandfather told stories about learning the dish from his own mother. When they finally ate, the meal tasted different from the version Dev remembered, but it was delicious. He realized that learning a skill involved both following instructions and understanding the reasons behind them, so he wrote down the steps and the little clues that mattered.",
  "A group of neighbours decided to make their lane safer for children walking to school. They began by observing traffic for a few mornings and noting where drivers turned too quickly. Rather than arguing with one another, they collected their observations and discussed them with the local council. The council agreed to repaint a faded crossing and place a sign near the corner. Parents also took turns helping younger children cross during the first week. The changes were modest, yet drivers slowed down and families felt more comfortable. The neighbours learned that community projects became easier when people shared clear information, listened to different concerns, and chose practical steps they could complete together.",
  "Ira had always wanted to learn photography, but she believed that a good camera was the most important part of the process. For her first project, she borrowed a simple camera and photographed ordinary things around her home: a cup beside a window, shadows on a wall, and rain drops on a plant. She experimented with distance and light, taking several pictures of the same object. When she reviewed them, she noticed that the clearest images came from moments when she had slowed down and considered what she wanted to show. She began carrying the camera during daily walks and kept notes about each attempt. Over time, Ira developed a style of her own and discovered that curiosity, patience, and observation mattered more than expensive equipment."

    else s.className='rem';
    d.appendChild(s);
  }
  // Preserve the view, but scroll by the active visual row rather than by one character.
  // This keeps each line fully visible as the player approaches its final word.
  d.scrollTop=previousScrollTop;
  var current=POS<TXT.length?d.children[POS]:null;
  if(current){
    var children=d.children;
    var charRect=current.getBoundingClientRect();
    var lineTop=charRect.top;
    var lineBottom=charRect.bottom;
    var i, r;
    for(i=POS-1;i>=0;i--){
      r=children[i].getBoundingClientRect();
      if(Math.abs(r.top-charRect.top)>2)break;
      lineTop=Math.min(lineTop,r.top);
      lineBottom=Math.max(lineBottom,r.bottom);
    }
    for(i=POS+1;i<children.length;i++){
      r=children[i].getBoundingClientRect();
      if(Math.abs(r.top-charRect.top)>2)break;
      lineTop=Math.min(lineTop,r.top);
      lineBottom=Math.max(lineBottom,r.bottom);
    }
    var boxRect=d.getBoundingClientRect();
    var visibleTop=boxRect.top+d.clientTop+8;
    var visibleBottom=boxRect.bottom-d.clientTop-8;
    if(lineBottom>visibleBottom)d.scrollTop+=lineBottom-visibleBottom;
    else if(lineTop<visibleTop)d.scrollTop-=visibleTop-lineTop;
  }

function finishTyping(reason){
  if(LESSON_FINISHED)return;

  var wpm=getWpm();

  if(reason==='complete'&&TAB==='course'&&accuracy>=80){
    if(!UNLOCK[CI])UNLOCK[CI]=[];

      UNLOCK[CI][LI+1]=true;

      if(!UNLOCK[CI+1])UNLOCK[CI+1]=[];
      UNLOCK[CI+1][0]=true;
    }
  }
  saveProgress();

  var message=reason==='time'
    ? 'Time is up! WPM: '+wpm+' Acc: '+accuracy+'%'
    : (accuracy>=80
        ? 'Done! WPM: '+wpm+' Acc: '+accuracy+'%'

  closeOver();

  POS++;
  // Refill the Zombie typing queue while several words are still left.
  // The final-word branch remains as a safety fallback for any edge case.
  if(LAB_SESSION_ACTIVE&&GAME==='zombie')extendZombieTextIfNeeded();
  render();
  if(POS>=TXT.length){
    if(LAB_SESSION_ACTIVE&&GAME==='zombie'){
      extendZombieTextIfNeeded();
      render();
    }else if(TAB==='lab'&&LAB_DURATION>0){
      TXT+=' '+gen(LAB_DURATION===60?100:300);
      render();
    }else{
      finishTyping('complete');
      e.preventDefault();
      return;
    }
  }
  e.preventDefault();
});
initStorage();
renderCourse();
</script>
