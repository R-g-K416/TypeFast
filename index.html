<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Master 40 Lessons - Ramgopal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;transition:.3s}
.top{height:60px;background:#fff;border-bottom:2px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;position:sticky;top:0;z-index:10;gap:6px;flex-wrap:wrap}
.badge{padding:7px 12px;background:#f1f5f9;border:2px solid #e2e8f0;border-radius:10px;font-weight:800;cursor:pointer;font-size:12px}
.badge.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.iconBtn{width:38px;height:38px;border-radius:50%;border:2px solid #e2e8f0;background:#f1f5f9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.layout{display:grid;grid-template-columns:260px 1fr;max-width:1200px;margin:0 auto}
.left{background:#fff;border-right:2px solid #e2e8f0;padding:12px;min-height:calc(100vh - 60px);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.ubtn{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:12px;margin:6px 0;cursor:pointer;font-weight:800;text-align:left;background:#f8fafc;display:flex;gap:10px;align-items:center}
.ubtn.active{background:#eef2ff;border-color:#4f46e5;color:#4f46e5}
.right{padding:14px}
.box{background:#fff;border:2px solid #e2e8f0;border-radius:14px;margin-bottom:14px;overflow:hidden}
.head{padding:12px 14px;background:#f8fafc;border-bottom:2px solid #e2e8f0;font-weight:800;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:12px}
.card{border:2px solid #e2e8f0;border-radius:14px;padding:12px;cursor:pointer;background:#fff;transition:.2s;text-align:center}
.card:hover{border-color:#4f46e5;transform:translateY(-3px)}
.card.lock{opacity:.35;pointer-events:none}
.footer{background:#0f172a;color:#fff;text-align:center;padding:14px;border-radius:12px;margin-top:16px;font-weight:700}
#over{position:fixed;inset:0;background:#f1f5f9;z-index:100;display:none;flex-direction:column;overflow:auto}
.ohead{height:56px;background:#fff;border-bottom:2px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;position:sticky;top:0}
#gameBox{border:3px solid #e2e8f0;border-radius:14px;margin:10px;position:relative;display:none;height:320px;width:calc(100% - 20px);max-width:1000px;align-self:center;background:#87ceeb;overflow:hidden}
#textBox{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin:10px;font-family:monospace;font-size:19px;line-height:2.1;min-height:110px;outline:none;white-space:pre-wrap;word-break:break-word;width:calc(100% - 20px);max-width:1000px;align-self:center}
.ok{background:#bbf7d0;color:#000;border-radius:4px}.bad{background:#fecaca;color:#000;border-radius:4px}.cur{background:#bfdbfe;color:#000;box-shadow:inset 0 -3px 0 #3b82f6;border-radius:4px}.rem{color:#94a3b8}
.stats{display:flex;gap:6px;margin:8px 12px;width:calc(100% - 24px);max-width:1000px;align-self:center}
.stats div{flex:1;background:#fff;border:2px solid #e2e8f0;border-radius:10px;padding:6px;text-align:center;font-size:12px}
.kbd{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;background:#e0e7ff;padding:8px;margin:10px 12px 30px;border-radius:10px;width:calc(100% - 24px);max-width:1000px;align-self:center}
.key{width:36px;height:36px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;border:1px solid #e2e8f0;font-size:12px}
.key.on{background:#4f46e5;color:#fff}.key.sp{width:150px}
.plat{position:absolute;width:68px;height:24px;background:#7c2d12;color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid #000}
.cat{position:absolute;width:42px;height:42px;background:#facc15;border-radius:50%;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:5;transition:.25s}
.coin{position:absolute;width:16px;height:16px;background:gold;border-radius:50%;border:2px solid #a16207;display:flex;align-items:center;justify-content:center;font-size:10px;color:#000}
.car{position:absolute;width:70px;height:36px;background:#ef4444;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #000;z-index:5;transition:.2s}
.zom{position:absolute;width:54px;height:54px;background:#22c55e;border-radius:50% 50% 10% 10%;display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid #000;z-index:4}
.zword{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:#fff;padding:2px 6px;border-radius:6px;border:2px solid #000;font-weight:800;font-size:10px;color:#000;white-space:nowrap}
.player{position:absolute;left:16px;bottom:42px;font-size:30px;z-index:5;display:flex;align-items:center}
.gun{transform:scaleX(-1);display:inline-block}

body.dark {

}

}

}

}

body.dark .bad {

}

body.dark .cur {
  background: #1d4ed8;
  color: #fff;
}

body.dark .kbd {
  background: #0f172a;
}

body.dark .footer {
  background: #000;
  color: #fff;
}

body.dark .ohead button {
  background: #1e293b !important;
  color: #fff;
  border-color: #475569 !important;
}

body.dark #gameBox {
  border-color: #475569;
}

/* UNIT COLORS - DARK MODE */

body.dark .ubtn {
    background: #1e293b !important;
    color: #e2e8f0 !important;
    border-color: #334155 !important;
}

body.dark .ubtn.active {
    background: #312e81 !important;
    color: #ffffff !important;
    border-color: #818cf8 !important;
}

/* Unit lesson count badge */
body.dark .ubtn small {
    filter: brightness(0.85);
    color: #ffffff !important;
}

/* Lesson cards use the selected unit's accent color */
body.dark .card > div:first-child {
    filter: brightness(1.2);
}

body.dark .card span {
    border-color: #475569 !important;
}

/* Keep unit icons and accent colors visible */
body.dark .ubtn > span {
    filter: brightness(1.15);
}  

/* FIX DONE / START / LOCKED BADGES IN DARK MODE */

body.dark .card span {
    background: #1e293b !important;
    color: #cbd5e1 !important;
    border: 1px solid #475569 !important;
}

/* Done */
body.dark .card span[style*="#dcfce7"] {
    background: #166534 !important;
    color: #ffffff !important;
    border-color: #22c55e !important;
}

/* Start */
body.dark .card span[style*="#f1f5f9"] {
    background: #334155 !important;
    color: #ffffff !important;
    border-color: #64748b !important;
}

/* Lesson icons */
body.dark .card > div:first-child {
    filter: brightness(1.15);
}
  
</style>
</head>

var MODE='simple',GAME='cat',LEVEL=1,TAB='course',CI=0,LI=0,POS=0,COR=0,WRO=0,STAT=[],START=0,COINS=0,UNLOCK=[],TIMER=null,COMBO=0,TXT="",BEST=0,PLATS=[],PIDX=0,CAM=0,ZOMBIES=[],ZINT=null,DARK=false,LESSON_FINISHED=false,LAB_DURATION=0;
var STORAGE_KEY='tm_40_lessons_v1';
function safeLoad(){try{var r=localStorage.getItem(STORAGE_KEY);if(!r)return null;return JSON.parse(r);}catch(e){return null;}}
function safeSave(o){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(o));}catch(e){}}
function initStorage(){
  var d=safeLoad();
  if(d&&d.unlock&&d.unlock.length===DATA.length){UNLOCK=d.unlock;COINS=d.coins||0;BEST=d.best||0;DARK=!!d.dark;LEVEL=d.level||1;}
  else{UNLOCK=[];for(var i=0;i<DATA.length;i++){UNLOCK[i]=[];UNLOCK[i][0]=true;}COINS=0;BEST=0;DARK=false;LEVEL=1;safeSave({unlock:UNLOCK,coins:COINS,best:BEST,dark:DARK,level:LEVEL});}
  if(DARK)document.body.classList.add('dark');
  updateThemeIcon();
  document.getElementById('levelSel').value=LEVEL;
  document.getElementById('coinTxt').textContent=COINS;
}
function saveProgress(){safeSave({unlock:UNLOCK,coins:COINS,best:BEST,dark:DARK,level:LEVEL});}
function countUnlocked(a){if(!a)return 0;var n=0;for(var i=0;i<a.length;i++)if(a[i])n++;return n;}
function gen(n){var t=[];for(var i=0;i<n;i++)t.push(WORDS[Math.floor(Math.random()*WORDS.length)]);return t.join(' ');}
function updateThemeIcon(){
  var icon=document.getElementById('themeIcon');
  if(!icon)return;
  icon.textContent=DARK?'☀️':'🌙';
  icon.title=DARK?'Switch to light mode':'Switch to dark mode';
  icon.setAttribute('aria-label',icon.title);
}
function toggleDark(){DARK=!DARK;document.body.classList.toggle('dark',DARK);updateThemeIcon();saveProgress();}

function changeMode(v){MODE=v;document.getElementById('modeSel').value=v;document.getElementById('gameOpts').style.display=(v==='game')?'flex':'none';if(document.getElementById('over').style.display==='flex'){buildGame();render();}renderCourse();}
function changeGame(v){GAME=v;document.getElementById('gameType').value=v;if(document.getElementById('over').style.display==='flex'){buildGame();render();}}
function changeLevel(v){LEVEL=parseInt(v);document.getElementById('levelSel').value=v;saveProgress();if(document.getElementById('over').style.display==='flex'){buildGame();render();}if(TAB==='lab')renderLab();}
function renderCourse(){
  var L=document.getElementById('left');L.innerHTML='<div style="font-size:11px;font-weight:800;color:#64748b">UNITS - 10 LESSONS EACH</div><div id="ulist"></div>';
  var ul=document.getElementById('ulist');

  document.getElementById('right').innerHTML='<div id="uview"></div><div class="footer">Made by Ramgopal Kumawat</div>';

}
function renderUnit(ui){
  var v=document.getElementById('uview');var u=DATA[ui];var c=countUnlocked(UNLOCK[ui]);
  v.innerHTML='<div class="box"><div class="head"><span>'+u.icon+' '+u.title+' - 10 Lessons</span><span style="background:'+u.color+';color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">'+c+'/'+u.lessons.length+'</span></div><div class="grid" id="g'+ui+'"></div></div>';
  var g=document.getElementById('g'+ui);
  for(var li=0;li<u.lessons.length;li++){
    var ls=u.lessons[li];var locked=!(UNLOCK[ui]&&UNLOCK[ui][li]);var isDone=UNLOCK[ui]&&UNLOCK[ui][li]&&((li+1<u.lessons.length&&UNLOCK[ui][li+1])||(li===u.lessons.length-1&&countUnlocked(UNLOCK[ui])>li));
    if(li===0&&UNLOCK[ui][0]&&UNLOCK[ui][1])isDone=true;
    var card=document.createElement('div');card.className='card'+(locked?' lock':'');
    card.innerHTML='<div style="width:44px;height:44px;border-radius:10px;background:'+u.color+'20;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:'+u.color+';margin:0 auto 6px">'+ls.icon+'</div><b style="font-size:13px">'+(li+1)+'. '+ls.name+'</b><div style="margin-top:6px"><span style="font-size:10px;padding:3px 8px;border-radius:20px;background:'+(isDone?'#dcfce7':'#f1f5f9')+';font-weight:800;border:1px solid #e2e8f0">'+(isDone?'✓ Done':locked?'Locked':'Start')+'</span></div>';
    (function(a,b){card.onclick=function(){openFix(a,b);};})(ui,li);g.appendChild(card);
  }
}
function renderLab(){
  document.getElementById('left').innerHTML='<div style="font-size:11px;font-weight:800;color:#64748b">LAB</div>';
  var R=document.getElementById('right');
  R.innerHTML='<div style="margin-bottom:10px"><div style="font-size:18px;font-weight:900">Practice Lab</div></div><div class="box"><div class="head">All Modes</div><div class="grid" id="labGrid"></div></div><div class="footer">Made by Ramgopal Kumawat</div>';

  for(var i=0;i<LAB.length;i++){
    var lb=LAB[i];var card=document.createElement('div');card.className='card';card.style.textAlign='left';card.style.display='flex';card.style.gap='12px';card.style.alignItems='center';
    card.innerHTML='<div style="width:52px;height:52px;flex-shrink:0;background:'+lb.bg+';border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px">'+lb.icon+'</div><div><b style="font-size:14px">'+lb.title+'</b><div style="font-size:11px;color:#64748b">'+lb.desc+'</div></div>';
    (function(t){card.onclick=function(){openRand(t);};})(lb.type);g.appendChild(card);
  }
}
function openFix(ci,li){if(!(UNLOCK[ci]&&UNLOCK[ci][li])){alert('Locked! Complete previous.');return;}LAB_DURATION=0;TXT=DATA[ci].lessons[li].text;CI=ci;LI=li;startOver((li+1)+'. '+DATA[ci].lessons[li].name);}
function openRand(t){LAB_DURATION=t==='speed1'?60:(t==='speed5'?300:0);if(t==='words')TXT=gen(28);else if(t==='story')TXT="The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs.";else if(t==='speed1')TXT=gen(100);else if(t==='speed5')TXT=gen(300);else if(t==='zombie'){TXT=gen(30);changeMode('game');changeGame('zombie');}else if(t==='car'){TXT=gen(36);changeMode('game');changeGame('car');}else if(t==='cat'){TXT=gen(36);changeMode('game');changeGame('cat');}startOver('Lab '+t);}
function startOver(title){LESSON_FINISHED=false;POS=0;COR=0;WRO=0;STAT=[];START=0;COMBO=0;PLATS=[];PIDX=0;CAM=0;ZOMBIES=[];clearInterval(TIMER);clearInterval(ZINT);document.getElementById('over').style.display='flex';document.getElementById('otitle').textContent=title;document.getElementById('stime').textContent=LAB_DURATION===60?'01:00':(LAB_DURATION===300?'05:00':'00:00');document.getElementById('gameBox').style.display=(MODE==='game')?'block':'none';buildGame();buildKbd();render();startTimer();}
function closeOver(){document.getElementById('over').style.display='none';clearInterval(TIMER);clearInterval(ZINT);if(TAB==='course')renderCourse();else renderLab();}
function render(){var d=document.getElementById('textBox');d.innerHTML='';for(var i=0;i<TXT.length;i++){var s=document.createElement('span');s.textContent=TXT[i];if(i<POS)s.className=STAT[i]?'ok':'bad';else if(i===POS)s.className='cur';else s.className='rem';d.appendChild(s);}var nxt=TXT[POS]||'';var keys=document.querySelectorAll('.key');for(var k=0;k<keys.length;k++){keys[k].classList.remove('on');if(keys[k].dataset.k===nxt.toLowerCase())keys[k].classList.add('on');}document.getElementById('swpm').textContent=getWpm();document.getElementById('sacc').textContent=getAcc()+'%';document.getElementById('scombo').textContent=COMBO+'x';document.getElementById('coinTxt').textContent=COINS;if(MODE==='game')moveGame();}
function buildKbd(){var k=document.getElementById('kbd');k.innerHTML='';var rows=["qwertyuiop","asdfghjkl","zxcvbnm"];for(var r=0;r<rows.length;r++)for(var c=0;c<rows[r].length;c++){var el=document.createElement('div');el.className='key';el.dataset.k=rows[r][c];el.textContent=rows[r][c];k.appendChild(el);}var sp=document.createElement('div');sp.className='key sp';sp.dataset.k=' ';sp.textContent='SPACE';k.appendChild(sp);}
function buildGame(){
  if(MODE!=='game')return;var a=document.getElementById('gameBox');a.innerHTML='';
  var speed=LEVEL===1?0.5:LEVEL===2?0.8:LEVEL===3?1.2:LEVEL===4?1.7:2.3;
  if(GAME==='cat'){
    a.style.background='linear-gradient(180deg,#60a5fa 0%,#93c5fd 32%,#fef3c7 32%,#fde68a 100%)';
    var cat=document.createElement('div');cat.className='cat';cat.id='catObj';cat.textContent='🐱';cat.style.left='20px';cat.style.bottom='80px';a.appendChild(cat);
    PLATS=[];var tot=Math.min(TXT.length,40);for(var i=0;i<tot;i++){var p=document.createElement('div');p.className='plat';p.id='p'+i;p.style.left=(20+i*70-CAM)+'px';p.style.bottom=(45+(i%4)*42)+'px';p.textContent=TXT[i]===' '?'_':TXT[i].toUpperCase();a.appendChild(p);var co=document.createElement('div');co.className='coin';co.id='c'+i;co.style.left=(20+i*70+22-CAM)+'px';co.style.bottom=(45+(i%4)*42+26)+'px';co.textContent='★';a.appendChild(co);PLATS.push({x:20+i*70,y:45+(i%4)*42});}
  }else if(GAME==='car'){
    a.style.background='linear-gradient(#87CEEB 0%,#22c55e 45%,#333 45%,#111 100%)';
    var car=document.createElement('div');car.className='car';car.id='carObj';car.textContent='🏎️';car.style.left='20px';car.style.bottom='90px';a.appendChild(car);
  }else if(GAME==='zombie'){
    a.style.background='linear-gradient(180deg,#020617,#1e293b)';
    var player=document.createElement('div');player.className='player';player.id='player';player.innerHTML='<span>🧍</span><span class="gun">🔫</span>';a.appendChild(player);
    ZOMBIES=[];var words=TXT.split(' ');for(var i=0;i<Math.min(words.length,5+LEVEL);i++){var z=document.createElement('div');z.className='zom';z.id='z'+i;z.style.left=(300+i*100)+'px';z.style.bottom='45px';z.innerHTML='🧟<div class="zword">'+words[i]+'</div>';a.appendChild(z);ZOMBIES.push({word:words[i],x:300+i*100,alive:true,id:'z'+i});}
    ZINT=setInterval(function(){for(var i=0;i<ZOMBIES.length;i++){if(ZOMBIES[i].alive){ZOMBIES[i].x-=speed;var el=document.getElementById(ZOMBIES[i].id);if(el){el.style.left=ZOMBIES[i].x+'px';if(ZOMBIES[i].x<80){el.style.display='none';ZOMBIES[i].alive=false;}}}}},40);
  }
}
function moveGame(){
  if(GAME==='cat'){
    var cat=document.getElementById('catObj');if(!cat||!PLATS[PIDX])return;
    var tx=PLATS[PIDX].x-CAM;if(PIDX>5&&PLATS[PIDX].x-CAM>350){CAM+=70;for(var i=0;i<PLATS.length;i++){var p=document.getElementById('p'+i);var c=document.getElementById('c'+i);if(p)p.style.left=(PLATS[i].x-CAM)+'px';if(c)c.style.left=(PLATS[i].x+22-CAM)+'px';}tx=PLATS[PIDX].x-CAM;}
    cat.style.left=tx+12+'px';cat.style.bottom=(PLATS[PIDX].y+28)+'px';var co=document.getElementById('c'+PIDX);if(co)co.style.display='none';
  }else if(GAME==='car'){var car=document.getElementById('carObj');if(!car)return;var pct=Math.min(100,Math.round(PIDX/TXT.length*100));car.style.left=(20+pct*4)+'px';}
}
function getWpm(){if(!START)return 0;var m=(Date.now()-START)/60000;if(m<0.05)return 0;return Math.round((COR/5)/m);}
function getAcc(){var t=COR+WRO;return t?Math.round(COR/t*100):100;}
function startTimer(){
  clearInterval(TIMER);
  TIMER=setInterval(function(){
    if(!START||LESSON_FINISHED)return;
    var elapsed=Math.floor((Date.now()-START)/1000);
    if(LAB_DURATION>0){
      var remaining=Math.max(0,LAB_DURATION-elapsed);
      document.getElementById('stime').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
      if(remaining<=0)finishTyping('time');
    }else{
      document.getElementById('stime').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');
    }
  },100);
}
function finishTyping(reason){
  if(LESSON_FINISHED)return;
  LESSON_FINISHED=true;
  clearInterval(TIMER);
  clearInterval(ZINT);

  var accuracy=getAcc();
  var wpm=getWpm();
  if(wpm>BEST)BEST=wpm;

  // Only Course lessons affect unlock progress; finishing a Lab never unlocks a lesson.
  if(reason==='complete'&&TAB==='course'&&accuracy>=80){
    if(!UNLOCK[CI])UNLOCK[CI]=[];
    if(LI+1<DATA[CI].lessons.length){
      UNLOCK[CI][LI+1]=true;
    }else if(CI+1<DATA.length){
      if(!UNLOCK[CI+1])UNLOCK[CI+1]=[];
      UNLOCK[CI+1][0]=true;
    }
  }
  saveProgress();

  var message=reason==='time'
    ? 'Time is up! WPM: '+wpm+' Acc: '+accuracy+'%'
    : (accuracy>=80
        ? 'Done! WPM: '+wpm+' Acc: '+accuracy+'%'
        : 'Need 80% - You: '+accuracy+'%');

  // Close the typing overlay before the alert; a completion guard prevents repeat alerts.
  closeOver();
  alert(message);
}

document.addEventListener('keydown',function(e){
  if(document.getElementById('over').style.display!=='flex'||LESSON_FINISHED)return;
  if(LAB_DURATION>0&&START&&Date.now()-START>=LAB_DURATION*1000){finishTyping('time');e.preventDefault();return;}
  if(e.key==='Backspace'){if(POS>0){POS--;if(STAT[POS])COR=Math.max(0,COR-1);else WRO=Math.max(0,WRO-1);STAT.pop();COMBO=Math.max(0,COMBO-1);if(MODE==='game'&&GAME==='cat'&&PIDX>0){PIDX--;if(CAM>0)CAM=Math.max(0,CAM-70);}}render();e.preventDefault();return;}
  if(e.ctrlKey||e.altKey||e.metaKey)return;if(e.key.length!==1&&e.key!==' '){e.preventDefault();return;}
  if(START===0)START=Date.now();
  var exp=TXT[POS];
  if(e.key===exp){STAT[POS]=true;COR++;COMBO++;COINS++;document.getElementById('coinTxt').textContent=COINS;
    if(MODE==='game'){
      if(GAME==='cat')PIDX=Math.min(PIDX+1,PLATS.length-1);
      else if(GAME==='car'){PIDX++;}
      else if(GAME==='zombie'){
        var lastWord=TXT.substring(0,POS+1).trim().split(' ').pop();
        var frontIdx=-1,frontX=9999;
        for(var i=0;i<ZOMBIES.length;i++){if(ZOMBIES[i].alive&&ZOMBIES[i].word===lastWord){if(ZOMBIES[i].x<frontX){frontX=ZOMBIES[i].x;frontIdx=i;}}}
        if(frontIdx!==-1){var el=document.getElementById(ZOMBIES[frontIdx].id);if(el){el.textContent='💥';setTimeout(function(){var ee=document.getElementById('z'+frontIdx);if(ee)ee.style.display='none';},350);ZOMBIES[frontIdx].alive=false;}}
      }
    }
  }else{STAT[POS]=false;WRO++;COMBO=0;}
  POS++;render();
  if(POS>=TXT.length){
    if(TAB==='lab'&&LAB_DURATION>0){
      TXT+=' '+gen(LAB_DURATION===60?100:300);
      render();
    }else{
      finishTyping('complete');
      e.preventDefault();
      return;
    }
  }
  e.preventDefault();
});
initStorage();
renderCourse();
</script>
